<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · RAG Bench</title>
<style nonce="__NONCE__">
:root{color-scheme:light;font-family:system-ui,sans-serif;color:#242737;background:#f6f7fc}*{box-sizing:border-box}body{margin:0;padding:32px 20px}main{max-width:440px;margin:6vh auto;background:white;border:1px solid #e8eaf2;border-radius:18px;padding:32px}h1{font-size:26px;letter-spacing:-.7px;margin:0 0 10px}p{color:#687080;line-height:1.55}button,input{font:inherit;min-height:46px;border-radius:9px;width:100%}button{cursor:pointer;border:1px solid #dce0ea;background:white;color:#242737;padding:10px 16px}button.primary{background:#655ce0;color:white;border-color:#655ce0}button:disabled{opacity:.6;cursor:wait}label{display:block;font-size:14px;margin:18px 0 7px}input{border:1px solid #cdd2df;padding:10px 12px;background:#f6f7fc}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #169b8a;outline-offset:3px}.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:#81889b;font-size:13px}.divider:before,.divider:after{content:"";flex:1;border-top:1px solid #e8eaf2}.actions{display:flex;gap:12px;margin:18px 0}.actions button{font-size:13px;width:auto;border:0;padding:4px;min-height:44px}#submit{margin-top:24px}#notice{font-size:14px;padding:12px;border-radius:9px;background:#eef4f2;color:#24675f}small{display:block;color:#687080;line-height:1.5;margin-top:24px}[hidden]{display:none!important}
</style></head><body><main>
<h1 id="title">Sign in to RAG Bench</h1><p id="intro">Your experiments, private to your account.</p>
<button id="github" class="primary" type="button">Continue with GitHub</button><div class="divider" id="divider">or use email</div>
<form id="form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" maxlength="254" required>
<div id="password-group"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></div>
<button class="primary" id="submit" type="submit">Sign in</button></form>
<div class="actions"><button id="signup" type="button">Create an account</button><button id="recover" type="button">Forgot password?</button></div>
<p id="notice" role="status" aria-live="polite" hidden></p>
<small>Neon manages account details and passwords. Ragbench stores your account identifier and private experiments. Your benchmark passages and answers are sent to Groq when you run an evaluation.</small>
</main><script nonce="__NONCE__">
const config=__CONFIG__, $=id=>document.getElementById(id);
let mode='signin', busy=false;
const callback=config.origin+'/auth/login?flow='+encodeURIComponent(config.flow);
function notice(text){$('notice').textContent=text;$('notice').hidden=false}
function setMode(next){mode=next;$('title').textContent=next==='signup'?'Create your account':next==='recover'?'Reset your password':next==='reset'?'Choose a new password':'Sign in to RAG Bench';$('github').hidden=next!=='signin';$('divider').hidden=next!=='signin';$('password-group').hidden=next==='recover';$('password').required=next!=='recover';$('email').required=next!=='reset';$('email').hidden=next==='reset';document.querySelector('label[for=email]').hidden=next==='reset';$('password').autocomplete=next==='signin'?'current-password':'new-password';$('password').minLength=next==='signin'?1:12;$('submit').textContent=next==='signup'?'Create account':next==='recover'?'Send reset link':next==='reset'?'Save new password':'Sign in';$('signup').textContent=next==='signin'?'Create an account':'Back to sign in';$('notice').hidden=true}
async function provider(path,body){const response=await fetch(config.provider+path,{method:body?'POST':'GET',credentials:'include',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(15000)});const data=await response.json();if(!response.ok)throw new Error('Sign-in was not completed. Check your details or verify your email, then try again.');return data}
async function complete(){const session=await provider('/get-session');if(!session?.user)return false;if(!session.user.emailVerified){notice('Verify your email before signing in. Check your inbox and spam folder.');return false}const jwt=await provider('/token');if(!jwt.token)throw new Error('Your session could not be verified. Please sign in again.');const response=await fetch('/auth/finish',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+jwt.token},body:JSON.stringify({flow:config.flow}),signal:AbortSignal.timeout(15000)});if(!response.ok)throw new Error('Your account could not be verified. Please restart sign-in from the dashboard.');const result=await response.json();try{await provider('/sign-out',{})}catch{}const destination=new URL(config.dashboard);destination.searchParams.set('rb_flow',config.flow);destination.searchParams.set('rb_ticket',result.ticket);location.replace(destination.href);return true}
async function operation(action){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await action()}catch(error){notice(error.message||'Connection failed. Please try again.')}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
$('signup').onclick=()=>setMode(mode==='signin'?'signup':'signin');$('recover').onclick=()=>setMode('recover');
$('github').onclick=()=>operation(async()=>{const data=await provider('/sign-in/social',{provider:'github',callbackURL:callback,disableRedirect:true});const destination=new URL(data.url);const pinned=new URL(config.provider),neonInit=destination.origin===pinned.origin&&destination.pathname===pinned.pathname+'/sign-in/social/init';if(destination.protocol!=='https:'||destination.username||destination.password||(!neonInit&&destination.hostname!=='github.com'))throw new Error('Invalid sign-in destination');location.assign(destination.href)});
$('form').onsubmit=event=>{event.preventDefault();operation(async()=>{const email=$('email').value.trim(),password=$('password').value;if(mode==='recover'){await provider('/request-password-reset',{email,redirectTo:config.origin+'/auth/reset'});notice('If this address has an account, you’ll receive a reset link. Check your inbox and spam folder.');return}if(mode==='reset'){await provider('/reset-password',{newPassword:password,token:new URLSearchParams(location.search).get('token')});history.replaceState(null,'',config.origin+'/auth/reset');$('password').value='';$('form').hidden=true;document.querySelector('.actions').hidden=true;$('title').textContent='Password updated';$('intro').textContent='Return to Ragbench and start sign-in with your new password.';notice('Your new password has been saved.');return}if(mode==='signup'){await provider('/sign-up/email',{email,password,name:email.split('@')[0],callbackURL:callback});$('password').value='';notice('Check your email to verify your account, then sign in.');return}await provider('/sign-in/email',{email,password});$('password').value='';await complete()})};
if(new URLSearchParams(location.search).has('token'))setMode('reset');else if(config.flow)operation(async()=>{try{await complete()}catch{notice('Sign in to continue.')}});else{$('form').hidden=true;$('github').hidden=true;$('divider').hidden=true;document.querySelector('.actions').hidden=true;notice('Open the password reset link from your email, or start sign-in from Ragbench.');}
</script></body></html>
