# Free compute; authoritative data/checkpoints live in external Neon Free PostgreSQL.
services:
  - type: web
    name: rag-bench-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: API_TOKEN
        generateValue: true
      - key: GROQ_REQUEST_INTERVAL
        value: "4"
      - key: DATA_STORAGE
        value: ephemeral
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: RAGBENCH_LANGSMITH
        value: "false"
