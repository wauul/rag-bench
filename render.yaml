# Compact int8 ONNX runtime; free instances have ephemeral result storage.
services:
  - type: web
    name: rag-bench-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: API_TOKEN
        generateValue: true
      - key: GROQ_REQUEST_INTERVAL
        value: "4"
