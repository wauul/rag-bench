[project]
name = "ragbench"
version = "1.1.0"
requires-python = ">=3.11,<3.12"
description = "Durable CPU RAG comparison service and dashboard"
dependencies = []

[project.optional-dependencies]
backend = [
  "fastapi==0.162.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "python-dotenv==1.2.4",
  "pydantic==2.14.1",
  "chromadb==1.5.9",
  "ragas==0.4.3",
  "instructor>=1.12,<2",
  "tenacity==9.2.1",
  "langchain-groq==1.1.3",
  "groq==0.37.1",
  "langchain-core==1.7.0",
  "langchain==1.4.7",
  "langchain-community==0.4.2",
  "langchain-openai==1.7.2",
  "langgraph==1.2.14",
  "langgraph-prebuilt==1.1.1",
  "langgraph-sdk==0.4.9",
  "langgraph-checkpoint==4.3.0",
  "langgraph-checkpoint-sqlite==3.1.2",
  "langgraph-checkpoint-postgres==3.2.0",
  "psycopg[binary]==3.3.6",
  "pandas==3.1.0",
  "pypdf==6.21.2",
  "httpx==0.28.1",
  "PyJWT[crypto]==2.15.1",
  "psutil==7.2.2",
  "langfuse>=4.7,<6",
]
cpu = ["sentence-transformers==6.2.0", "torch==2.14.1", "transformers==5.20.2"]
compact = ["onnxruntime==1.31.0", "tokenizers==0.23.3", "huggingface-hub>=1,<3"]
models = ["onnx==1.23.2", "onnxruntime==1.31.0", "tokenizers==0.23.3", "huggingface-hub>=1,<3", "pydantic==2.14.1"]
dashboard = ["streamlit==1.66.1", "pandas==3.1.0", "plotly==7.1.0", "requests==2.34.2", "python-dotenv==1.2.4"]

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "pytest-cov>=6,<8", "ruff>=0.14,<1", "mypy>=1.18,<3",
       "pip-audit>=2.9,<3", "bandit>=1.8,<2", "pyyaml>=6,<7", "types-requests", "types-PyYAML"]

[tool.uv]
package = false
constraint-dependencies = ["pillow>=12.3.0", "starlette>=1.3.1"]
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'", "sys_platform == 'win32' and platform_machine == 'AMD64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
follow_imports = "silent"
files = ["backend/settings.py", "backend/models.py", "backend/ingestion.py", "scripts/backup.py", "scripts/deploy.py", "scripts/smoke.py", "scripts/postgres_backup.py", "scripts/release_manifest.py", "scripts/quality_gate.py", "backend/prompts.py", "backend/observability.py", "backend/optimization_budget.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real pinned local-model integration without paid provider calls"]

[tool.coverage.run]
source = ["backend", "scripts"]
omit = ["scripts/deploy_hf.py", "scripts/run_demo.py", "scripts/prepare_onnx.py", "scripts/check_onnx.py", "scripts/check_retrieval.py", "scripts/profile_run.py"]

[tool.coverage.report]
show_missing = true

[tool.bandit]
exclude_dirs = ["tests", ".venv", ".tools"]
