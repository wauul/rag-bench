name: Authorized live evaluation
on:
  workflow_dispatch:
    inputs:
      image:
        description: Tested compact GHCR image digest
        required: true
        type: string
      max_requests:
        description: Explicit HTTP-attempt ceiling (1-300)
        default: '48'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: authorized-evaluation
  cancel-in-progress: false
jobs:
  evaluation:
    runs-on: ubuntu-latest
    environment: evaluation
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require exact trusted artifact and explicit credentials
        env:
          IMAGE: ${{ inputs.image }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEILING: ${{ inputs.max_requests }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import os,re; assert os.environ["GROQ_API_KEY"]; assert re.fullmatch(r"ghcr.io/wauul/rag-bench-compact@sha256:[0-9a-f]{64}",os.environ["IMAGE"]); assert 1<=int(os.environ["CEILING"])<=300'
          gh attestation verify "oci://$IMAGE" --repo wauul/rag-bench --signer-workflow wauul/rag-bench/.github/workflows/release.yml
          docker pull "$IMAGE"
          mkdir -p reports
          chmod 777 reports
          docker run --rm --env GROQ_API_KEY --env RAGBENCH_LANGFUSE=false --env RAGBENCH_LANGSMITH=false --mount "type=bind,source=$PWD/reports,target=/reports" "$IMAGE" python -m scripts.live_evaluation --approve-provider-spend --max-requests "$CEILING" --image "$IMAGE" --output /reports/live-evaluation.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: authorized-live-evaluation
          path: reports/live-evaluation.json
          if-no-files-found: error
          retention-days: 14
