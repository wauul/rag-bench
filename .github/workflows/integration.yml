name: Local model integration
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: read
concurrency:
  group: local-model-integration
  cancel-in-progress: false
jobs:
  models:
    name: Pinned models (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, compact]
    env:
      RAGBENCH_TEST_REAL_MODELS: "1"
      RAGAS_DO_NOT_TRACK: "true"
      HF_HUB_DISABLE_TELEMETRY: "1"
      RAGBENCH_LANGSMITH: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install selected runtime
        env:
          VARIANT: ${{ matrix.variant }}
        run: uv sync --locked --extra backend --extra "$VARIANT" --extra models
      - name: Prepare compact models
        if: matrix.variant == 'compact'
        run: uv run --no-sync python -m scripts.prepare_onnx
      - name: Run real retrieval through both engines
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = compact ]; then export INFERENCE_BACKEND=onnx; fi
          uv run --no-sync python -m pytest tests/test_real_retrieval.py -q --junitxml=reports/integration.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: integration-${{ matrix.variant }}
          path: reports/integration.xml
          if-no-files-found: error
