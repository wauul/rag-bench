name: Local model integration
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"
permissions:
  contents: read
concurrency:
  group: local-model-integration
  cancel-in-progress: false
jobs:
  models:
    name: Pinned models (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, compact]
    env:
      RAGBENCH_TEST_REAL_MODELS: "1"
      RAGAS_DO_NOT_TRACK: "true"
      HF_HUB_DISABLE_TELEMETRY: "1"
      RAGBENCH_LANGSMITH: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install selected runtime
        env:
          VARIANT: ${{ matrix.variant }}
        run: uv sync --locked --extra backend --extra "$VARIANT" --extra models
      - name: Prepare compact models
        if: matrix.variant == 'compact'
        run: uv run --no-sync python -m scripts.prepare_onnx
      - name: Run real retrieval through both engines
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = compact ]; then export INFERENCE_BACKEND=onnx; fi
          uv run --no-sync python -m pytest tests/test_real_retrieval.py -q --junitxml=reports/integration.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-${{ matrix.variant }}
          path: reports/integration.xml
          if-no-files-found: error
          retention-days: 14
