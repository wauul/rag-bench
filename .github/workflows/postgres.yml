name: PostgreSQL recovery
on:
  push:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ragbench_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.19'
      - run: uv sync --locked --extra backend --extra compact --extra dashboard
      - run: uv run --no-sync python -m pytest tests/test_postgres.py tests/test_postgres_workflows.py tests/test_postgres_restore_workflows.py -q --junitxml=reports/postgres.xml
        env:
          RAGBENCH_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:5432/ragbench_test
          RAGAS_DO_NOT_TRACK: 'true'
          RAGBENCH_LANGSMITH: 'false'
          RAGBENCH_PG_DOCKER: '1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: postgres-recovery
          path: reports/postgres.xml
          if-no-files-found: error
          retention-days: 14
