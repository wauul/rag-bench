name: PostgreSQL recovery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ragbench_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.19'
      - run: uv sync --locked --extra backend --extra compact --extra dashboard
      - run: uv run --no-sync python -m pytest tests/test_postgres.py -q
        env:
          RAGBENCH_TEST_POSTGRES_URL: postgresql://postgres@localhost:5432/ragbench_test
          RAGAS_DO_NOT_TRACK: 'true'
          RAGBENCH_LANGSMITH: 'false'
