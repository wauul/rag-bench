name: Engineering
on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: engineering-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  RAGAS_DO_NOT_TRACK: "true"
  HF_HUB_DISABLE_TELEMETRY: "1"
  RAGBENCH_LANGSMITH: "false"
jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra backend --extra cpu --extra compact --extra dashboard --extra models
      - run: uv run --no-sync python -m scripts.export_requirements --check
      - run: uv run --no-sync python -m scripts.checks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: |
            reports/tests.xml
            reports/coverage.xml
            reports/coverage.json
          if-no-files-found: error
          retention-days: 14
  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
      - run: uv sync --locked --extra backend --extra cpu --extra compact --extra dashboard --extra models
      - run: uv run --no-sync python -m scripts.install_tools
      - run: .tools/bin/actionlint
      - run: .tools/bin/gitleaks git --redact=100 --no-banner
      - run: python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
      - run: uv run --no-sync python -m bandit -r backend scripts -ll -f json -o reports/bandit.json
      - run: uv run --no-sync python -m scripts.security
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 14
          name: security-reports
          path: |
            reports/bandit.json
            reports/dependencies.json
  containers:
    name: Containers (${{ matrix.variant }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            dockerfile: Dockerfile
          - variant: compact
            dockerfile: Dockerfile.render
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ragbench-api:test
          build-args: APP_REVISION=${{ github.sha }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.dashboard
          load: true
          tags: ragbench-dashboard:test
          build-args: APP_REVISION=${{ github.sha }}
      - run: python -m scripts.install_tools
      - name: Validate Compose and actual artifacts
        env:
          API_TOKEN: ci-test-only-token-with-at-least-32-characters
          DASHBOARD_PASSWORD: ci-test-only-dashboard-password-at-least-32-characters
        run: |
          docker compose --env-file /dev/null config --quiet
          python -m scripts.container_smoke --api ragbench-api:test --dashboard ragbench-dashboard:test
      - name: Scan tested images
        run: |
          mkdir -p reports
          .tools/bin/trivy image --scanners vuln --format json --output reports/api-container.json ragbench-api:test
          .tools/bin/trivy image --scanners vuln --format json --output reports/dashboard-container.json ragbench-dashboard:test
          python -m scripts.security --container reports/api-container.json
          python -m scripts.security --container reports/dashboard-container.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 14
          name: containers-${{ matrix.variant }}
          path: reports/*container.json
  postgres:
    uses: ./.github/workflows/postgres.yml
  gate:
    name: Engineering gate
    runs-on: ubuntu-latest
    if: always()
    needs: [quality, security, containers, postgres]
    steps:
      - name: Require every dependency to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python -c 'import json,os; r=json.loads(os.environ["RESULTS"]); assert all(v["result"] == "success" for v in r.values()), r'
